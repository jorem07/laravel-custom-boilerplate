          $ref: "#/components/responses/StandardItemResponse"

  /office-services/show/{office_services}:
    get:
      tags: [Office Services]
      summary: Show office service
      parameters:
        - $ref: "#/components/parameters/officeServicesId"
      responses:
        "200":
          $ref: "#/components/responses/StandardItemResponse"

  /office-services/{office_services}:
    put:
      tags: [Office Services]
      summary: Update office service
      parameters:
