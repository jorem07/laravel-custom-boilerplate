  /queues:
    get:
      tags: [Queues]
      summary: List queues (authenticated)
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/show"
      responses:
        "200":
          $ref: "#/components/responses/StandardListResponse"
    post:
      tags: [Queues]
      summary: List queues (POST, authenticated)
      requestBody:
        $ref: "#/components/requestBodies/ListRequest"
      responses:
        "200":
          $ref: "#/components/responses/StandardListResponse"

  /queues/store:
    post:
      tags: [Queues]
      summary: Create queue ticket (public)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueuePublicStore"
      responses:
        "200":
          description: Queue created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/StandardEnvelope"
                  - type: object
                    properties:
                      body:
                        type: array
                        items:
                          $ref: "#/components/schemas/Queue"

  /queues/show/{queues}:
    get:
      tags: [Queues]
      summary: Show queue by UUID (public)
      security: []
      parameters:
        - name: queues
          in: path
          required: true
          description: Queue UUID
          schema:
            type: string
            format: uuid
      responses:
        "200":
          $ref: "#/components/responses/StandardItemResponse"

  /queues/{queues}:
    put:
      tags: [Queues]
      summary: Update queue (authenticated)
      parameters:
        - $ref: "#/components/parameters/queuesId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueueUpdate"
      responses:
        "200":
          $ref: "#/components/responses/StandardItemResponse"

  /queues/delete/{queues}:
    delete:
      tags: [Queues]
      summary: Delete queue (authenticated)
      parameters:
        - $ref: "#/components/parameters/queuesId"
      responses:
        "200":
          $ref: "#/components/responses/StandardDeleteResponse"

  /queues/current:
    get:
      tags: [Queues]
      summary: Current active queues for today
      responses:
        "200":
          description: Active queue snapshot
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/StandardEnvelope"
                  - type: object
                    properties:
                      body:
                        type: array
                        items:
                          $ref: "#/components/schemas/Queue"
                      others:
                        $ref: "#/components/schemas/QueueSnapshotOthers"

  /queues/next:
    post:
      tags: [Queues]
      summary: Call next waiting queue to a counter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueueNext"
      responses:
        "200":
          description: Next queue called or no queue available
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/StandardEnvelope"
                  - type: object
                    properties:
                      body:
                        type: array
                        items:
                          $ref: "#/components/schemas/Queue"
                      others:
                        $ref: "#/components/schemas/QueueNextOthers"

  /counters:
    get:
      tags: [Counters]
      summary: List counters
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/show"
      responses:
        "200":
          $ref: "#/components/responses/StandardListResponse"

  /counters/store:
    post:
      tags: [Counters]
      summary: Create counter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CounterStore"
      responses:
        "200":
          description: Counter created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/StandardEnvelope"
                  - type: object
                    properties:
                      body:
                        type: array
                        items:
                          $ref: "#/components/schemas/Counter"

  /counters/show/{counters}:
    get:
      tags: [Counters]
      summary: Show counter
      parameters:
        - $ref: "#/components/parameters/countersId"
      responses:
        "200":
          $ref: "#/components/responses/StandardItemResponse"

  /counters/{counters}:
    put:
      tags: [Counters]
      summary: Update counter
      parameters:
        - $ref: "#/components/parameters/countersId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CounterUpdate"
      responses:
        "200":
          $ref: "#/components/responses/StandardItemResponse"

  /counters/delete/{counters}:
    delete:
      tags: [Counters]
      summary: Delete counter
      parameters:
        - $ref: "#/components/parameters/countersId"
      responses:
        "200":
          $ref: "#/components/responses/StandardDeleteResponse"

  /counters/active:
    get:
      tags: [Counters]
      summary: List all counters with login state
      responses:
        "200":
          description: Active counters
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/StandardEnvelope"
                  - type: object
                    properties:
                      body:
                        type: array
                        items:
                          $ref: "#/components/schemas/Counter"

  /counters/login:
    post:
      tags: [Counters]
      summary: Log user into counter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CounterLogin"
      responses:
        "200":
          description: User logged in
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/StandardEnvelope"
                  - type: object
                    properties:
                      others:
                        type: object
                        properties:
                          log:
                            $ref: "#/components/schemas/CounterUserLog"

  /counters/logout:
    post:
      tags: [Counters]
      summary: Log user out of counter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [counter_id]
              properties:
                counter_id:
                  type: integer
      responses:
        "200":
          description: User logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardEnvelope"

  /counters/performance:
    get:
      tags: [Counters]
      summary: Top counter performance metrics for today
      parameters:
        - name: office_service_id
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 5
      responses:
        "200":
          description: Performance rankings
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/StandardEnvelope"
                  - type: object
                    properties:
                      body:
                        type: array
                        items:
                          $ref: "#/components/schemas/CounterPerformance"

  /counter-user-logs:
    get:
      tags: [Counters]
      summary: Today's counter login logs
      responses:
        "200":
          description: Counter user logs
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/StandardEnvelope"
                  - type: object
                    properties:
                      body:
                        type: array
                        items:
                          $ref: "#/components/schemas/CounterUserLog"

  /users:
