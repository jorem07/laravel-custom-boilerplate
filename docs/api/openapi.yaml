      responses:
        "200":
          $ref: "#/components/responses/StandardItemResponse"

  /announcements/show/{announcements}:
    get:
      tags: [Announcements]
      summary: Show announcement
      parameters:
        - $ref: "#/components/parameters/announcementsId"
