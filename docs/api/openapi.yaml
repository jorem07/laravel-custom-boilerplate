  /announcement-statuses:
    get:
      tags: [Announcement Statuses]
      summary: List announcement statuses
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/show"
      responses:
        "200":
          $ref: "#/components/responses/StandardListResponse"

  /announcement-statuses/store:
    post:
      tags: [Announcement Statuses]
      summary: Create announcement status
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NamedEntityStore"
      responses:
        "200":
          $ref: "#/components/responses/StandardItemResponse"

  /announcement-statuses/show/{announcement_statuses}:
    get:
      tags: [Announcement Statuses]
      summary: Show announcement status
      parameters:
        - $ref: "#/components/parameters/announcementStatusesId"
      responses:
        "200":
          $ref: "#/components/responses/StandardItemResponse"

  /announcement-statuses/{announcement_statuses}:
    put:
      tags: [Announcement Statuses]
      summary: Update announcement status
      parameters:
        - $ref: "#/components/parameters/announcementStatusesId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NamedEntityStore"
      responses:
        "200":
          $ref: "#/components/responses/StandardItemResponse"

  /announcement-statuses/delete/{announcement_statuses}:
    delete:
      tags: [Announcement Statuses]
      summary: Delete announcement status
      parameters:
        - $ref: "#/components/parameters/announcementStatusesId"
      responses:
        "200":
          $ref: "#/components/responses/StandardDeleteResponse"

  /pdf/queue:
    get:
      tags: [PDF]
      summary: Generate queue receipt PDF (inline)
      security: []
      parameters:
        - name: uuid
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: disposition
          in: query
          schema:
            type: string
            enum: [inline, download]
            default: inline
      responses:
        "200":
          description: PDF document
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "422":
          $ref: "#/components/responses/ValidationError"
    post:
      tags: [PDF]
      summary: Generate queue receipt PDF
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [uuid]
              properties:
                uuid:
                  type: string
                  format: uuid
                disposition:
                  type: string
                  enum: [inline, download]
                  default: inline
      responses:
        "200":
          description: PDF document
          content:
            application/pdf:
              schema:
                type: string
                format: binary

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Laravel Sanctum personal access token

  parameters:
    page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    show:
      name: show
      in: query
      description: Page size
      schema:
        type: integer
        minimum: 1
        default: 10
    sortColumn:
      name: sort[column]
      in: query
      schema:
        type: string
        default: updated_at
    sortOrder:
      name: sort[order]
      in: query
      schema:
        type: string
        enum: [asc, desc]
        default: desc
    officesId:
      name: offices
      in: path
      required: true
      schema:
        type: integer
    officeServiceCategoriesId:
      name: office_service_categories
      in: path
      required: true
      schema:
        type: integer
    officeServicesId:
      name: office_services
      in: path
      required: true
      schema:
        type: integer
    queueStatusesId:
      name: queue_statuses
      in: path
      required: true
      schema:
        type: integer
    queuesId:
      name: queues
      in: path
      required: true
      schema:
        type: integer
    countersId:
      name: counters
      in: path
      required: true
      schema:
        type: integer
    usersId:
      name: users
      in: path
      required: true
      schema:
        type: integer
    rolesId:
      name: roles
      in: path
      required: true
      schema:
        type: integer
    displaysId:
      name: displays
      in: path
      required: true
      schema:
        type: integer
    announcementsId:
      name: announcements
      in: path
      required: true
      schema:
        type: integer
    announcementStatusesId:
      name: announcement_statuses
      in: path
      required: true
      schema:
        type: integer

  requestBodies:
    ListRequest:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ListParams"

  responses:
    StandardListResponse:
      description: Paginated list
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/StandardEnvelope"
    StandardItemResponse:
      description: Single item
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/StandardEnvelope"
    StandardDeleteResponse:
      description: Deleted
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/StandardEnvelope"
              - type: object
                properties:
                  body:
                    nullable: true
    ValidationError:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationError"

  schemas:
    ListParams:
      type: object
      properties:
        page:
          type: integer
        show:
          type: integer
        full_search:
          type: string
        search:
          type: array
          items:
            type: object
            properties:
              key:
                type: string
              value:
                type: string
        sort:
          type: object
          properties:
            column:
              type: string
            order:
              type: string
              enum: [asc, desc]

    StandardEnvelope:
      type: object
      properties:
        message:
          type: string
        error:
          nullable: true
        details:
          type: object
          properties:
            current_page:
              type: integer
            from:
              type: integer
            to:
              type: integer
            last_page:
              type: integer
            skip:
              type: integer
            take:
              type: integer
            total:
              type: integer
        headers:
          nullable: true
        body:
          oneOf:
            - type: array
              items:
                type: object
            - type: object
            - type: "null"
        searchable:
          type: array
          items:
            type: string
        others:
          nullable: true

    ValidationError:
      type: object
      properties:
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string

    LoginResponse:
      type: object
      properties:
        message:
          type: string
        user:
          type: object
        token:
          type: string

    NamedEntityStore:
      type: object
      required: [name]
      properties:
        name:
          type: string

    OfficeStore:
      type: object
      required: [name]
      properties:
        name:
          type: string

    OfficeServiceCategoryStore:
      type: object
      required: [type]
      properties:
        type:
          type: string
          description: Category type; also used as queue number prefix

    OfficeServiceStore:
      type: object
      required: [name, office_id, office_service_category_id]
      properties:
        name:
          type: string
        office_id:
          type: integer
        office_service_category_id:
          type: integer

    QueuePublicStore:
      type: object
      required: [queue_status_id, office_service_id]
      properties:
        queue_status_id:
          type: integer
        office_service_id:
          type: integer
      description: uuid and time_start are assigned server-side

    QueueUpdate:
      type: object
      required: [queue_status_id, counter_id, user_id]
      properties:
        queue_status_id:
          type: integer
        counter_id:
          type: integer
        user_id:
          type: integer

    QueueNext:
      type: object
      required: [counter_id]
      properties:
        counter_id:
          type: integer
        user_id:
          type: integer
          description: Must match logged-in counter user when provided

    Queue:
      type: object
      properties:
        id:
          type: integer
        queue_no:
          type: string
          example: BP-001
        uuid:
          type: string
          format: uuid
        queue_status_id:
          type: integer
        office_service_id:
          type: integer
        counter_id:
          type: integer
          nullable: true
        user_id:
          type: integer
          nullable: true
        time_start:
          type: string
          format: date-time
        time_end:
          type: string
          format: date-time
          nullable: true
        estimated_wait_minutes:
          type: integer
          nullable: true
        estimated_time_return:
          type: string
          format: date-time
          nullable: true
        queue_status:
          type: object
        counter:
          type: object
        user:
          type: object

    CounterStore:
      type: object
      required: [name, office_service_id]
      properties:
        name:
          type: string
        office_service_id:
          type: integer
        user_id:
          type: integer
          nullable: true

    CounterUpdate:
      type: object
      required: [name, office_service_id]
      properties:
        name:
          type: string
        office_service_id:
          type: integer

    CounterLogin:
      type: object
      required: [counter_id, user_id]
      properties:
        counter_id:
          type: integer
        user_id:
          type: integer

    Counter:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        user_id:
          type: integer
          nullable: true
        office_service_id:
          type: integer
          nullable: true
        user_name:
          type: string
          nullable: true
        office_service_name:
          type: string
          nullable: true
        is_logged_in:
          type: boolean

    CounterUserLog:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        counter_id:
          type: integer
        log_in:
          type: string
          format: date-time
        log_out:
          type: string
          format: date-time
          nullable: true
        user_name:
          type: string
        counter_name:
          type: string

    CounterPerformance:
      type: object
      properties:
        counter_id:
          type: integer
        counter_name:
          type: string
        served:
          type: integer
        avg_time_minutes:
          type: number
        avg_time_label:
          type: string
        efficiency_percent:
          type: number

    QueueSnapshotOthers:
      type: object
      properties:
        counters:
          type: array
          items:
            $ref: "#/components/schemas/Counter"
        counter_logs:
          type: array
          items:
            $ref: "#/components/schemas/CounterUserLog"
        counter_performances:
          type: array
          items:
            $ref: "#/components/schemas/CounterPerformance"

    QueueNextOthers:
      allOf:
        - $ref: "#/components/schemas/QueueSnapshotOthers"
        - type: object
          properties:
            called:
              $ref: "#/components/schemas/Queue"

    UserStore:
      type: object
      required:
        - first_name
        - middle_name
        - last_name
        - email
        - password
        - password_confirmation
        - allow_login
        - status
        - role_id
      properties:
        first_name:
          type: string
        middle_name:
          type: string
        last_name:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          format: password
        password_confirmation:
          type: string
          format: password
        allow_login:
          type: boolean
        status:
          type: boolean
        role_id:
          type: array
          items:
            type: integer

    UserUpdate:
      allOf:
        - $ref: "#/components/schemas/UserStore"
        - type: object
          properties:
            current_password:
              type: string
            new_password:
              type: string

    DisplayStore:
      type: object
      required: [name]
      properties:
        name:
          type: string
        location:
          type: string
        status:
          type: string
        connection_status:
          type: string
        office_id:
          type: integer

    AnnouncementStore:
      type: object
      required:
        - title
        - description
        - publish_date
        - publish_time
        - created_by
        - announcement_status_id
      properties:
        title:
          type: string
        description:
          type: string
        publish_date:
          type: string
          format: date
        publish_time:
          type: string
        expire_date:
          type: string
          format: date
        expire_time:
          type: string
        created_by:
          type: integer
        office_id:
          type: integer
        announcement_status_id:
          type: integer

    AnnouncementUpdate:
      type: object
      required:
        - title
        - description
        - publish_date
        - publish_time
        - announcement_status_id
      properties:
        title:
          type: string
        description:
          type: string
        publish_date:
          type: string
          format: date
        publish_time:
          type: string
        expire_date:
          type: string
          format: date
        expire_time:
          type: string
        announcement_status_id:
          type: integer
