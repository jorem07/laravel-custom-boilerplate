openapi: 3.1.0
info:
  title: Camiguin Queueing API
  description: |
    REST API for the Camiguin government queueing system.

    - Authentication via Laravel Sanctum Bearer tokens
    - Authorization via Silber Bouncer permissions
    - Real-time updates on `queue-channel` / `queue.updated`

    Synchronized from repository on 2026-07-30.
  version: 1.0.0
  contact:
    name: Infosoft

servers:
  - url: http://localhost/api
    description: Local development
  - url: "{baseUrl}/api"
    description: Custom deployment
    variables:
      baseUrl:
        default: http://localhost

tags:
  - name: Authentication
    description: Login, logout, password reset, email verification
  - name: Offices
  - name: Office Service Categories
  - name: Office Services
  - name: Queue Statuses
  - name: Queues
    description: Queue tickets and queue operations
  - name: Counters
    description: Service counters and staff assignment
  - name: Users
  - name: Roles
  - name: Displays
  - name: Announcements
  - name: Announcement Statuses
  - name: PDF
    description: Queue receipt generation

security:
  - bearerAuth: []

paths:
  /auth/login:
    post:
      tags: [Authentication]
      summary: User login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "422":
          $ref: "#/components/responses/ValidationError"

  /auth/logout:
    post:
      tags: [Authentication]
      summary: User logout
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                logout:
                  type: string
                  enum: [others, all]
                  description: Revoke other sessions, all sessions, or current only when omitted
      responses:
        "200":
          description: Logout successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

  /forgot-password:
    post:
      tags: [Authentication]
      summary: Request password reset email
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        "200":
          description: Reset link sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

  /reset-password/{token}:
    get:
      tags: [Authentication]
      summary: Get password reset token (placeholder)
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Token returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string

  /email/verify/{id}/{hash}:
    get:
      tags: [Authentication]
      summary: Verify email address
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: hash
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Email verified
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

  /offices:
    get:
      tags: [Offices]
      summary: List offices
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/show"
        - $ref: "#/components/parameters/sortColumn"
        - $ref: "#/components/parameters/sortOrder"
      responses:
        "200":
          $ref: "#/components/responses/StandardListResponse"
    post:
      tags: [Offices]
      summary: List offices (POST)
      requestBody:
        $ref: "#/components/requestBodies/ListRequest"
      responses:
        "200":
          $ref: "#/components/responses/StandardListResponse"

  /offices/store:
    post:
      tags: [Offices]
      summary: Create office
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OfficeStore"
      responses:
        "200":
          $ref: "#/components/responses/StandardItemResponse"

  /offices/show/{offices}:
    get:
      tags: [Offices]
      summary: Show office
      parameters:
        - $ref: "#/components/parameters/officesId"
      responses:
        "200":
          $ref: "#/components/responses/StandardItemResponse"
    post:
      tags: [Offices]
      summary: Show office (POST)
      parameters:
        - $ref: "#/components/parameters/officesId"
      responses:
        "200":
          $ref: "#/components/responses/StandardItemResponse"

  /offices/{offices}:
    put:
      tags: [Offices]
      summary: Update office
      parameters:
        - $ref: "#/components/parameters/officesId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OfficeStore"
      responses:
        "200":
          $ref: "#/components/responses/StandardItemResponse"
    patch:
      tags: [Offices]
      summary: Partially update office
      parameters:
        - $ref: "#/components/parameters/officesId"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OfficeStore"
      responses:
        "200":
          $ref: "#/components/responses/StandardItemResponse"

  /offices/delete/{offices}:
    delete:
      tags: [Offices]
      summary: Delete office
      parameters:
        - $ref: "#/components/parameters/officesId"
      responses:
        "200":
          $ref: "#/components/responses/StandardDeleteResponse"

  /office-service-categories:
    get:
      tags: [Office Service Categories]
      summary: List office service categories
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/show"
      responses:
        "200":
          $ref: "#/components/responses/StandardListResponse"
    post:
      tags: [Office Service Categories]
      summary: List office service categories (POST)
      requestBody:
        $ref: "#/components/requestBodies/ListRequest"
      responses:
        "200":
          $ref: "#/components/responses/StandardListResponse"

  /office-service-categories/store:
    post:
