      responses:
        "200":
          $ref: "#/components/responses/StandardItemResponse"

  /announcements/delete/{announcements}:
    delete:
      tags: [Announcements]
      summary: Delete announcement
      parameters:
        - $ref: "#/components/parameters/announcementsId"
      responses:
