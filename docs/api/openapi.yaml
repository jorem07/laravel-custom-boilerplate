      summary: Create office service category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OfficeServiceCategoryStore"
      responses:
        "200":
          $ref: "#/components/responses/StandardItemResponse"

  /office-service-categories/show/{office_service_categories}:
    get:
